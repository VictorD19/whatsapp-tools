name: zapchat-instagram-host
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: instagram_review
      POSTGRES_DB: instagram_review
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pilot_postgres:/var/lib/postgresql/data"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram_review -d instagram_review"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes: ["pilot_redis:/data"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    image: zapchat-instagram-pilot:${PILOT_RELEASE:?Choose an immutable Git commit}
    build:
      context: ../..
      dockerfile: infra/instagram-host/Dockerfile
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:${PILOT_HOST_PORT:-18012}:18012"]
    secrets: [pilot_runtime]
    mem_limit: 2304m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:18012/login'),fetch('http://127.0.0.1:18011/api/v1/instagram/status')]).then(([web,api])=>process.exit(web.status===200&&api.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]
    mem_limit: 128m
    depends_on:
      app: {condition: service_healthy}
secrets:
  db_password:
    file: ${PILOT_PRIVATE_DIR:?Choose a private directory outside the repository}/db-password
  pilot_runtime:
    file: ${PILOT_PRIVATE_DIR:?Choose a private directory outside the repository}/runtime.json
  tunnel_token:
    file: ${PILOT_PRIVATE_DIR:?Choose a private directory outside the repository}/cloudflared.token
volumes:
  pilot_postgres:
  pilot_redis:
